<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Intelligent URL Classifier</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="/" class="nav-logo">🛡️ URL Detector</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <!-- CONTENT CONTAINER -->
    <div class="container">
        <div class="header">
            <h1>Get in Touch</h1>
            <p>Have questions or feedback? Reach out to us below.</p>
        </div>

        <form style="display: flex; flex-direction: column; gap: 12px;">
            <label style="font-size: 0.9rem; color: var(--text-sub);">Your Name:</label>
            <input type="text" placeholder="John Doe" required>

            <label style="font-size: 0.9rem; color: var(--text-sub);">Email Address:</label>
            <input type="text" placeholder="name@example.com" required>

            <label style="font-size: 0.9rem; color: var(--text-sub);">Message:</label>
            <textarea style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: white; min-height: 100px; outline: none;"></textarea>

            <button type="submit" style="margin-top: 8px;">Send Message</button>
        </form>
    </div>

</body>
</html>
